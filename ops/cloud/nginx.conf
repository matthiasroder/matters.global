worker_processes 1;
pid /tmp/nginx.pid;
# Request-context error logs can contain OAuth query values too. Health and
# aggregate probes are the staging observability path; no request logs persist.
error_log /dev/null;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # OAuth codes, URLs, account identifiers and cookies must not become logs.
    access_log off;
    client_max_body_size 256k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;

    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate /run/tls/server.crt;
        ssl_certificate_key /run/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://app:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
