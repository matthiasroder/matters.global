services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: matters_ops
      POSTGRES_PASSWORD: ${MATTERS_PG_PASSWORD:?Supply an operator-owned staging environment file}
    labels:
      global.matters.operations-owner: ${MATTERS_OPERATIONS_OWNER:?Supply an explicit operations owner}
    volumes:
      - database:/var/lib/postgresql/data
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U matters_ops -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      staging:
        ipv4_address: ${MATTERS_STAGING_DATABASE_IP:?Prepare the private staging network}

  app:
    image: ${MATTERS_CLOUD_IMAGE:?Build and select the reviewed application image}
    command: ["--host", "0.0.0.0", "--port", "3000", "--public-origin", "${MATTERS_CLOUD_PUBLIC_ORIGIN:?Set the exact staging HTTPS origin}", "--mcp", "--trusted-proxy", "${MATTERS_STAGING_PROXY_IP:?Prepare the explicit trusted proxy}/32"]
    environment:
      MATTERS_CLOUD_DATABASE_URL: ${MATTERS_CLOUD_DATABASE_URL:?Supply a protected database URL}
    labels:
      global.matters.operations-owner: ${MATTERS_OPERATIONS_OWNER:?Supply an explicit operations owner}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import http.client;
          connection = http.client.HTTPConnection('127.0.0.1', 3000, timeout=3);
          connection.request('GET', '/healthz', headers={'Host': 'localhost'});
          assert connection.getresponse().status == 200
      interval: 5s
      timeout: 4s
      retries: 12
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    networks:
      staging:
        ipv4_address: ${MATTERS_STAGING_APP_IP:?Prepare the private staging network}

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    labels:
      global.matters.operations-owner: ${MATTERS_OPERATIONS_OWNER:?Supply an explicit operations owner}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MATTERS_STAGING_HTTPS_PORT:-19443}:8443"
    volumes:
      - ${MATTERS_STAGING_SECRETS:?Use a protected directory outside the repository}/server.crt:/run/tls/server.crt:ro
      - ${MATTERS_STAGING_SECRETS:?Use a protected directory outside the repository}/server.key:/run/tls/server.key:ro
    read_only: true
    tmpfs: ["/tmp:size=16m", "/var/cache/nginx:size=16m,uid=101,gid=101,mode=0700"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 64m
    pids_limit: 64
    networks:
      staging:
        ipv4_address: ${MATTERS_STAGING_PROXY_IP:?Prepare the explicit trusted proxy}

volumes:
  database:

networks:
  staging:
    labels:
      global.matters.operations-owner: ${MATTERS_OPERATIONS_OWNER:?Supply an explicit operations owner}
    ipam:
      config:
        - subnet: ${MATTERS_STAGING_SUBNET:?Choose an unused private staging subnet}
