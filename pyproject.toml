[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matters-global"
version = "0.1.0"
description = "Engine and agent skill support for working with matters, conditions, dependencies, universe, frontier, and horizon."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Matthias Roeder" }
]
dependencies = [
  "jsonschema>=4.20",
  "numpy>=1.24",
  "model2vec>=0.3",
  "platformdirs>=4.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
  "pytest>=9",
]
anthropic = [
  "anthropic>=0.117",
]
openai = [
  "openai>=2.51",
]
providers = [
  "anthropic>=0.117",
  "openai>=2.51",
]

[project.scripts]
matters = "matters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matters = ["web_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
