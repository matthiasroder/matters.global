[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matters-global"
version = "0.1.0"
description = "Engine and agent skill support for working with matters, conditions, dependencies, universe, frontier, and horizon."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Matthias Roeder" }
]
dependencies = [
  "jsonschema>=4.20",
  "numpy>=1.24",
  "model2vec>=0.3",
  "platformdirs>=4.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
cloud = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.31,<1",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
]
mcp = [
  "mcp>=1.30,<2",
]
test = [
  "pytest>=9",
  "httpx>=0.27,<0.29",
]
anthropic = [
  "anthropic>=0.117",
]
openai = [
  "openai>=2.51",
]
providers = [
  "anthropic>=0.117",
  "openai>=2.51",
]

[project.scripts]
matters = "matters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matters = ["web_assets/*", "cloud/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
